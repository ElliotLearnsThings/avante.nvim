[project]
name = "avante-claude-code"
version = "0.1.0"
description = "Adapter bridging avante.nvim to the native Claude Code CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
avante-claude-code = "avante_claude_code.adapter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["avante_claude_code"]
